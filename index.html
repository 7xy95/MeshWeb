<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mesh Web v1.2.0</title>
    <link rel="stylesheet" href="main.css">
    <style>
        input:focus {
            background-color: #1c1c1c;
        }
        .topArrow {
            background-color: #2c2c2c;
            color: #dfe6ed;
            border: none;
            margin: 8px;
            font-size: 20px;
        }
        .topArrow:hover {
            color: #a5abb1;
        }
        .tabIcons {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 42px;
            background-color: #1c1c1c;

            display: flex;
            align-items: center;
            padding: 5px;
            gap: 5px;
            box-sizing: border-box;
        }
        .tab {
            width: min(20%, 245px);
            background-color: #2c2c2c;
            color: #dfe6ed;
            height: 32px;

            display: flex;
            align-items: center;

            padding-left: 12px;
            padding-right: 8px;
            box-sizing: border-box;

            min-width: 0;
            border-radius: 8px 8px 0 0;

            font-family: Arial;
            font-size: 12px;
        }
        .tab p {
            margin: 0;
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .tabBtn {
            width: 24px;
            height: 24px;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 0;
            margin-left: 6px;

            background-color: transparent;
            border: none;
            border-radius: 50%;

            color: #dfe6ed;
            font-size: 18px;

            cursor: pointer;
        }
        .tab.active {
            background-color: #3b3b3b;
        }
        .tabIcon {
            width: 16px;
            height: 16px;
            margin-right: 6px;
        }

        #connection {
            position: absolute;
            right: 16px;
            top: 49px;
            margin: 0;
            color: orangered;
            font-family: Arial;
            line-height: 24px;
        }
    </style>
</head>
<body>
<div class="tabs">
    <div class="tabIcons" id="tabIcons">
        <button class="tabBtn" id="newTabBtn">+</button>
    </div>
    <button id="back" class="topArrow">←</button>
    <button id="forward" class="topArrow">→</button>
    <input style="width: 50vw; margin: 5px" id="urlInput">
    <p id="connection"></p>
</div>
<div id="pages"></div>
<script>
    const { ipcRenderer } = require("electron")
    ipcRenderer.on("ui:set", (event, data) => {
        let e = document.getElementById(data.id)
        if (!e) {return}
        e[data.property] = data.value
    })
    ipcRenderer.on("ui:style", (event, data) => {
        let e = document.getElementById(data.id)
        if (!e) {return}
        e.style[data.property] = data.value
    })
    ipcRenderer.on("ui:call", (event, data) => {
        let fn = window[data.functionName]
        if (typeof fn !== "function") {
            console.log("function not known: " + data.functionName)
            return
        }
        fn(...data.args)
    })
    ipcRenderer.on("new-tab-url", (event, url) => {
		newTab(url)
    })
    ipcRenderer.on("shortcut", (event, input) => {
		if (input.type !== "keyDown" || input.isAutoRepeat) {return}
        if (!(input.control || input.meta)) {return}

		let key = input.key.toLowerCase()
        if (key === "t") {
			window.focus()
			newTab()
        }
		else if (key === "w") {
			deleteTab(activeTab)
		}
		else if (key === "r") {
			page.reload()
		}
		else if (key === "l") {
			urlInput.focus()
            urlInput.select()
		}
		else if (key >= "1" && key <= "8") {
			let i = Number(key)-1
            if (tabs[i]) {
				window.focus()
				selectTab(tabs[i])
			}
        }
		else if (key === "9") {
			window.focus()
			selectTab(tabs[tabs.length-1])
        }
    })
    function run(code) {
        ipcRenderer.send("main:run", code)
    }
    async function get(code) {
        return await ipcRenderer.invoke("main:get", code)
    }

    window.addEventListener("error", (error) => {
        console.log(error)
    })
    window.addEventListener("unhandledrejection", (error) => {
        console.log(error)
    })


    let tabs = []
    let activeTab = null
	let urlInput = document.getElementById("urlInput")
	let page = null
    let draggedTab = null

    async function newTab(url = "mesh://search") {
		let webview = document.createElement("webview")
        webview.className = "page"
        webview.setAttribute("preload", "./webview.js")
		webview.setAttribute("allowpopups", "")
        webview.setAttribute("webpreferences", "disableDialogs=no")
        document.getElementById("pages").appendChild(webview)

        let icon = document.createElement("img")
        icon.className = "tabIcon"
        let tabIcon = document.createElement("div")
        tabIcon.className = "tab"
        tabIcon.draggable = true
        let title = document.createElement("p")
        title.innerText = "New Tab"
        let closeBtn = document.createElement("button")
		closeBtn.className = "tabBtn"
		closeBtn.innerText = "×"

        tabIcon.appendChild(icon)
        tabIcon.appendChild(title)
        tabIcon.appendChild(closeBtn)

		document.getElementById("tabIcons").insertBefore(tabIcon, document.getElementById("newTabBtn"))

        let tab = {webview, tabIcon, title, "mesh": false, "url": url}


		tabIcon.addEventListener("click", () => {
			selectTab(tab)
		})
        tabIcon.addEventListener("dragstart", () => {
			draggedTab = tab
			selectTab(draggedTab)
        })
        tabIcon.addEventListener("dragover", (event) => {
			event.preventDefault()
            event.clientY = 32
        })
        tabIcon.addEventListener("drop", (event) => {
			event.preventDefault()

            if (!draggedTab || draggedTab === tab) {return}

			let from = tabs.indexOf(draggedTab)
            let to = tabs.indexOf(tab)

            tabs.splice(from, 1)
            tabs.splice(to, 0, draggedTab)
            for (let t of tabs) {
				document.getElementById("tabIcons").insertBefore(t.tabIcon, document.getElementById("newTabBtn"))
            }
        })
        tabIcon.addEventListener("dragend", () => {
			draggedTab = null
        })
		closeBtn.addEventListener("click", event => {
			event.stopPropagation()
			deleteTab(tab)
		})
        webview.addEventListener("page-favicon-updated", event => {
			if (event.favicons.length > 0) {
				icon.src = event.favicons[0]
            }
        })
		webview.addEventListener("page-title-updated", event => {
			title.innerText = event.title || "New Tab"
		})
		webview.addEventListener("did-navigate", async (event) => {
			if (tab !== activeTab) { return }
			await updateUrl(event.url)

            let historyUrl = activeTab.mesh ? urlInput.value : event.url
			if (event.url !== "" && !event.url.startsWith("file://")) {
				run(`require("./js/storage.js").addHistory(${JSON.stringify(historyUrl)})`)
			}
		})
		webview.addEventListener("ipc-message", event => {
			if (tab !== activeTab) { return }
			if (event.channel === "ui:setUrl") {
				parseUrlInput(event.args[0])
			}
		})
		webview.addEventListener("did-navigate-in-page", (event) => {
			if (tab !== activeTab) { return }
			if (!event.isMainFrame) { return }
			updateUrl(event.url)
		})
        webview.addEventListener("will-navigate", (event) => {
			if (isMeshUrl(event.url)) {
				event.preventDefault()
                parseUrlInput(event.url)
            }
        })

        tabs.push(tab)
        selectTab(tab)

		urlInput.value = url
		await parseUrlInput(url)

        webview.addEventListener("dom-ready", async () => {
			if (activeTab === tab) {
				tab.webview.focus()
            }

			void webview.executeJavaScript(`
                window.prompt = function(message, defaultValue = "") {
                    if (defaultValue !== "") {
                        return defaultValue
                    }
                    return null
                }
            `)

			let wantsDark = await webview.executeJavaScript(`
                (() => {
                    let style = getComputedStyle(document.documentElement)
                    let meta = document.querySelector('meta[name="color-scheme"]')

                    return style.colorScheme.includes("dark") ||
                           meta?.content.includes("dark") ||
                           false
                })()`)
            if (wantsDark) {
				void webview.insertCSS(`html, body {background-color: #0d1116;}`)
            }
			else {
				void webview.insertCSS(`html, body {background-color: white;}`)
            }
        })
    }
	function selectTab(tab) {
		activeTab = tab
        activeTab.webview.focus()

        for (let t of tabs) {
			t.webview.style.display = t === tab ? "flex" : "none"
            t.tabIcon.classList.toggle("active", t === tab)
        }

		page = tab.webview
        updateUrl(page.src)
    }
	function deleteTab(tab) {
		let index = tabs.indexOf(tab)
        if (index === -1) {return}

		let wasActive = tab === activeTab
        tab.webview.remove()
        tab.tabIcon.remove()
        tabs.splice(index, 1)

        if (tabs.length === 0) {newTab(); return}

		if (wasActive) {
			selectTab(tabs[Math.min(index, tabs.length-1)])
        }
    }

	function saveTabs() {
		let savedTabs = tabs.map(tab => {return tab.url})

        localStorage.setItem("tabs", JSON.stringify(savedTabs))
    }
	async function loadTabs() {
		let savedTabs = JSON.parse(localStorage.getItem("tabs") || "[]")
        if (savedTabs.length === 0) {
			void newTab()
            return
        }
		for (let url of savedTabs) {
			await newTab(url)
        }
    }

	loadTabs()
    document.getElementById("newTabBtn").addEventListener("click", () => {
		newTab()
	})
    document.getElementById("back").addEventListener("click", () => {
		if (page.canGoBack()) {
			page.goBack()
        }
    })
	document.getElementById("forward").addEventListener("click", () => {
		if (page.canGoForward()) {
			page.goForward()
		}
	})

    async function updateUrl(u) {
		if (!u) {return}
        let url = new URL(u)
        if (url.protocol === "file:" && url.pathname.endsWith(".html") && url.pathname.includes("mainPage/")) {
            let name = url.pathname.match(/mainPage\/([^/]+)\.html$/)[1]
            let params = u.split(".html?")[1]
            if (!params) {
				urlInput.value = `mesh://${name}`
            }
			else {
				name = `mesh://${name}?${params}`
				urlInput.value = name
            }
            return
        }
		if (activeTab.mesh) {
			urlInput.value = await get(`global.endpointToDomain(${JSON.stringify(u)})`)
            if (activeTab.webview.src !== u) {
				activeTab.webview.src = u
            }
        }
		else {
			urlInput.value = u
        }
    }
    urlInput.addEventListener("keydown", async (event) => {
        if (event.key === "Enter") {
            void parseUrlInput(urlInput.value.trim())
        }
    })

    async function parseUrlInput(url) {
		activeTab.mesh = isMeshUrl(url)
        activeTab.url = url

        if (url.startsWith("mesh://")) {
            setMainPageUrl(url.slice(7))
            return
        }

        if (!url.startsWith("http://") && !url.startsWith("https://")) {
            url = "https://" + url
        }

        if (isMeshUrl(url)) {
            let domain = await get(`global.domainToEndpoint(${JSON.stringify(url)})`)
            if (domain === url) {
				setMainPageUrl(`notFound?name=${domain}`)
            }
			else if (domain.startsWith("mesh://")) {
				setMainPageUrl(domain.slice(7))
            }
			else {
				page.src = domain
            }
        }
        else if (url.includes(".") && !url.includes(" ")) {
            page.src = url
        }
        else if (url === "https://") {
            setMainPageUrl("search")
        }
        else {
            page.src = `https://www.google.com/search?q=${encodeURIComponent(url.slice(8))}`
        }
    }

    function setMainPageUrl(url) {
        let [pageName, query] = url.split("?")
        let path = `./mainPage/${pageName}.html`

        if (query) {path += "?" + query}

        page.src = new URL(path, window.location.href).href
    }

    function isMeshUrl(url) {
        try {
            url = url.includes("://")
                ? new URL(url)
                : new URL("https://" + url)

            return url.hostname.endsWith(".mesh")
        }
        catch {
            return false
        }
    }

	let connection = false
	setInterval(async () => {
		let nodes = await get('global.allNodes')
        let tunnel = await get('global.tunnelUrl')
        if (nodes.length === 0 || tunnel === null) {
			connection = true
			document.getElementById("connection").innerText = "Network connection lost"
        }
		else if (connection) {
            connection = false
			document.getElementById("connection").innerText = ""
        }
    }, 1500)

    setInterval(() => {
		saveTabs()
    }, 5000)
</script>
</body>
</html>
