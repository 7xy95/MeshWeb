<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Domain</title>
    <link rel="stylesheet" href="../main.css">
    <style>
        .webPage {
            width: 100%;
            height: 100%;
            padding: 64px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            font-family: "Times New Roman";
        }
        .header {
            font-size: 24px;
            margin: 0;
        }
        .text {
            font-size: 20px;
            margin-top: 14px;
            margin-bottom: 14px;
        }
        input {
            width: 30%;
        }
        body {
            background-color: #1c1c1c;
            min-height: 100vh;
            height: auto;
        }
    </style>
</head>
<body>
<div id="homePage" class="webPage" style="height: auto; padding-bottom: 0">
    <p class="header" style="margin-bottom: 8px">Lookup domain:</p>
    <input id="specificDomain" placeholder="Enter a .mesh domain">
</div>
<div id="domainSearch" class="webPage">
    <p class="header" style="margin-top: 0">Domain Info:</p>
    <p class="text" id="domainInfo"></p>
    <br>

    <p class="header">Mine Domain:</p>
    <p class="text">Enter endpoint:</p>
    <input id="endpoint">
    <p class="text">Enter seed:</p>
    <input id="address" oninput="updatePrivateKey(this.value)">
    <button class="btn" id="mineBtn" onclick="toggleMining()" style="width: 150px; margin-bottom: 50px">Start Mining</button>

    <p class="header">Change Endpoint (requires seed):</p>
    <p class="text">Seed:</p>
    <input id="seed">
    <p class="text">New Endpoint:</p>
    <input id="newEndpoint">
    <button class="btn" id="newEndpointBtn" onclick="changeEndpoint()" style="width: 150px; margin-bottom: 100px">Change</button>

</div>
</body>
<script>
	let params = new URLSearchParams(location.search)
	let name = params.get("name")
    if (!name) {
		document.getElementById("domainSearch").style.display = "none"
    }
	else {
		if (!name.endsWith(".mesh")) {name += ".mesh"}
		document.getElementById("specificDomain").value = name
    }

    function run(code) {
        window.mesh.run(code)
    }
    async function get(code) {
		return await window.mesh.get(code)
    }
	async function setUrl(url) {
		window.mesh.setUrl(url)
	}

    async function lookupDomain(domain, editParams=false) {
        let infoText = document.getElementById("domainInfo")
        if (!domain.endsWith(".mesh")) {
			domain += ".mesh"
            if (editParams) {document.getElementById("specificDomain").value = domain}
		}

        domain = (await get('global.domains')).find(item => item[0] === domain)
        if (!domain) {
            infoText.innerHTML = `
                Domain: ${name}<br>
                Endpoint: Unregistered<br>
                Difficulty: 31<br>
                Est time to mine: 15s<br>
            `
            return
        }

        let difficulty = Number(await get(`global.getDomainDifficulty(${JSON.stringify(domain[0])})`))
        let estTime = 2**difficulty / 50_000_000

        infoText.innerHTML = `
            Domain: ${domain[0]}<br>
            Endpoint: ${domain[3]}<br>
            Registered with address: ${domain[1].split("-----")[2].replace("MCowBQYDK2VwAyEA", "").toString("hex").slice(0, 24)} ...<br>
            Difficulty: ${difficulty.toFixed(2)}<br>
            Est time to mine: ${getTime(estTime/4)}<br>
        `
    }

	let domainSearch = document.getElementById("specificDomain")
	domainSearch.addEventListener("keydown", (event) => {
		if (event.key === "Enter") {
			setUrl(`mesh://domain?name=${domainSearch.value.trim()}`)
		}
	})

	function toggleMining() {
		if (document.getElementById("mineBtn").innerText === "Stop Mining") {
			document.getElementById("mineBtn").innerText = "Start Mining"
			run("global.stopMining()")
		}
		else {
			document.getElementById("mineBtn").innerText = "Stop Mining"
			let endpoint = document.getElementById("endpoint").value.trim()
			if (!endpoint.startsWith("https://") && !endpoint.startsWith("http://")) {
				endpoint = "https://" + endpoint
			}

			let domain = name
			if (!domain.endsWith(".mesh")) {
				domain = domain + ".mesh"
			}
			run(`global.mine(${JSON.stringify(domain)}, ${JSON.stringify(endpoint)})`)
		}
	}
	async function changeEndpoint() {
		let domain = name
		let endpoint = document.getElementById("newEndpoint").value.trim()
		if (!endpoint.startsWith("https://") && !endpoint.startsWith("http://") && !endpoint.startsWith("mesh://")) {
			endpoint = "https://" + endpoint
		}
		run(`global.updateDomain(${JSON.stringify(domain)}, ${JSON.stringify(endpoint)}, ${JSON.stringify(document.getElementById("seed").value.trim())})`)
    }
	async function updatePrivateKey(value) {
		run(`global.newKeys(${JSON.stringify(value)})`)
	}
	function getTime(seconds) {
		if (seconds < 60) {
			return `${Math.floor(seconds)}s`
        }
		if (seconds < 60**2) {
			let normal = seconds/60
            let floor = Math.floor(normal)
			return `${floor}m ${Math.floor((normal-floor)*60)}s`
        }
		if (seconds < 60**2 * 24) {
			let normal = seconds/3600
			let floor = Math.floor(normal)
			return `${floor}h ${Math.floor((normal-floor)*60)}m`
        }
		if (seconds < 60**2 * 24 * 356) {
			let normal = seconds/86400
			let floor = Math.floor(normal)
			return `${floor}d ${Math.floor((normal-floor)*24)}h`
		}
		let normal = seconds/31536000
		return `${normal.toFixed(2)}y`
    }

	if (name) {
        lookupDomain(name, true)
		setInterval(async () => {
			await lookupDomain(name)
		}, 1000)
    }
</script>
</html>
