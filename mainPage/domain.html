<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Domain</title>
    <link rel="stylesheet" href="../main.css">
    <link rel="icon" href="../assets/icon.png">
    <style>
        input::placeholder {
            color: #a5abb1;
        }
        .webPage {
            width: 100%;
            height: 100%;
            padding-left: 64px;
            margin-top: 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .text {
            font-size: 20px;
            margin-top: 14px;
            margin-bottom: 14px;
            line-height: 24px;
        }
        input:not([type="checkbox"]) {
            width: 30%;
        }
        body {
            background-color: #1c1c1c;
            min-height: 100vh;
            height: auto;
        }
        #changeStatus {
            padding-left: 64px;

        }
        .hideSeed {
            display: flex;
            align-items: center;
            margin: 0;
            padding: 0;

            position: relative;
            left: calc(30% + 20px);
            top: -48px;
        }
        #newEndpointBtn {
            margin-top: 8px;
            padding-left: 0;
            padding-right: 0;
        }
    </style>
</head>
<body>
    <div id="homePage" class="webPage" style="margin-top: 48px">
        <label for="specificDomain">Domain</label>
        <input id="specificDomain" placeholder="Enter a .mesh domain" autofocus>
    </div>
    <div class="webPage">
        <label for="seed">Seed</label>
        <input id="seed" oninput="updatePrivateKey(this.value)">
        <label class="hideSeed">
            <input type="checkbox" onchange="hide(this.checked)" style="border-radius: 0; border: none">
            <p class="text">Hide</p>
        </label>
    </div>
    <div class="webPage" style="position: relative; top: -60px;">
        <label for="endpoint">Endpoint</label>
        <input id="endpoint">
    </div>
    <div style="position: relative; top: -50px">
        <p class="text" id="changeStatus" style="margin-bottom: 0; min-height: 1em"></p>
        <p class="text" id="domainInfo" style="margin-left: 64px; margin-top: 0"></p>
        <div id="domainSearch" class="webPage">
            <button class="btn" id="mineBtn" onclick="toggleMining()" style="width: 150px">Start Mining</button>
            <button class="btn" id="newEndpointBtn" onclick="changeEndpoint()" style="width: 150px">Change Endpoint</button>
        </div>
        <p class="text" id="endpointChanged" style="margin-left: 64px; margin-top: 8px"></p>
    </div>
</body>
<script>
	let params = new URLSearchParams(location.search)
	let name = params.get("name") || ""
    if (name.includes("://")) {name = name.split("://")[1]}
    if (name.includes("/")) {name = name.split("/")[0]}
    if (!name) {
		document.getElementById("domainSearch").style.display = "none"
    }
	else {
		if (!name.endsWith(".mesh")) {name += ".mesh"}
		document.getElementById("specificDomain").value = name
    }

    function run(code) {
        window.mesh.run(code)
    }
	function getHashrate(hashrate, includeHashrate=true) {
		let names = ["H", "KH", "MH", "GH", "TH", "PH", "EH", "ZH", "YN"]
        let i = 0
        while (hashrate > 1000) {
			i++
            hashrate = hashrate/1000
        }
		if (includeHashrate) {
			return `Hashrate: ${hashrate.toPrecision(4)}${names[i]}/s`
        }
		else {
			return `${hashrate.toPrecision(4)}${names[i]}`
        }
    }
    async function get(code) {
		return await window.mesh.get(code)
    }
	async function setUrl(url) {
		window.mesh.setUrl(url)
	}
	let hashrate = 200_000_000
	async function updateEstimate() {
		if (!(document.getElementById("mineBtn").innerText === "Stop Mining")) {return}
        let lastT = (await get('global.getData()')).lastT
        if (lastT === 0 || lastT === null) {lastT = 1}
        hashrate = Math.floor(1000/lastT * 50_000_000)
    }

	function normalise(domain) {
		let normalised = ""
		for (let i=0; i<domain.length; i++) {
			let char = domain.charAt(i)
			if (/^[0-9a-z]$/.test(char) || char === "-" || char === ".") {
				normalised += char
			}
		}
		return normalised
    }

    async function lookupDomain(domain, editParams=false) {
		await updateEstimate()
        let infoText = document.getElementById("domainInfo")
        if (!domain.endsWith(".mesh")) {
			domain += ".mesh"
		}
		domain = domain.toLowerCase().replaceAll(" ", "")

		domain = normalise(domain)
        console.log(domain)
		if (editParams) {
			document.getElementById("specificDomain").value = domain

			let url = new URL(location.href)
			url.searchParams.set("name", domain)
			history.replaceState(null, "", url)
            name = domain
		}

        domain = (await get('global.domains')).find(item => item[0] === domain)

        let isMining = document.getElementById("mineBtn").innerText === "Stop Mining"
        let color = isMining ? 'green' : 'red'

        if (!domain) {
			let estTime = 2**31 / hashrate
            infoText.innerHTML = `
                Domain: ${name}<br>
                Endpoint: <span style="color: red">Unregistered</span><br>
                Difficulty: 31 bits (${getHashrate(2**31, false)})<br>
                Mining: <span style="color: ${color}">${isMining ? "On" : "Off"}</span>
                <br>${isMining ? `Est time to mine: ${getTime(estTime)}` : "&nbsp;"}
                <br>${isMining ? `${getHashrate(hashrate)}` : "&nbsp;"}
            `
            return
        }

		let difficulty = Number(await get(`global.getDomainDifficulty(${JSON.stringify(domain[0])})`))
		let estTime = 2**difficulty / hashrate

        infoText.innerHTML = `
            Domain: ${domain[0]}<br>
            Endpoint: <span id="currentEndpoint"></span><br>
            Difficulty: ${difficulty.toFixed(2)} bits (${getHashrate(2**difficulty, false)})<br>
            Mining: <span style="color: ${color}">${isMining ? "On" : "Off"}</span>
            <br>${isMining ? `Est time to mine: ${getTime(estTime)}` : "&nbsp;"}
            <br>${isMining ? `${getHashrate(hashrate)}` : "&nbsp;"}
        `
        document.getElementById("currentEndpoint").textContent = domain[3] === "" ? "None" : domain[3]
    }

	let domainSearch = document.getElementById("specificDomain")
	domainSearch.addEventListener("keydown", (event) => {
		if (event.key === "Enter") {
			setUrl(`mesh://domain?name=${domainSearch.value.trim()}`)
		}
	})

	function toggleMining() {
		lookupDomain(name)
		if (document.getElementById("mineBtn").innerText === "Stop Mining") {
			document.getElementById("mineBtn").innerText = "Start Mining"
			run("global.stopMining()")
		}
		else {
			let endpoint = document.getElementById("endpoint").value.trim()
			if (document.getElementById("seed").value.trim() === "") {return}
			document.getElementById("mineBtn").innerText = "Stop Mining"
			if (!endpoint.startsWith("https://") && !endpoint.startsWith("http://")) {
				endpoint = "https://" + endpoint
			}
			if (endpoint === "https://") {endpoint = ""}

			let domain = name
			if (!domain.endsWith(".mesh")) {
				domain = domain + ".mesh"
			}
			run(`global.mine(${JSON.stringify(domain)}, ${JSON.stringify(endpoint)})`)
		}
	}
    async function changeEndpoint() {
		let domain = name
		let endpoint = document.getElementById("endpoint").value.trim()
		if (document.getElementById("seed").value.trim() === "") {return}
		lookupDomain(name)
		if (endpoint !== "") {
			if (!endpoint.startsWith("https://") && !endpoint.startsWith("http://") && !endpoint.startsWith("mesh://")) {
				endpoint = "https://" + endpoint
			}
        }
		run(`global.updateDomain(${JSON.stringify(domain)}, ${JSON.stringify(endpoint)}, ${JSON.stringify(document.getElementById("seed").value.trim())})`)
        let changed = document.getElementById("endpointChanged")
        changed.innerText = "Endpoint Updated!"
        await new Promise(resolve => setTimeout(resolve, 2000))
		changed.innerText = ""
    }
	async function updatePrivateKey(value) {
		run(`global.newKeys(${JSON.stringify(value)})`)
	}
	function getTime(seconds) {
		if (seconds < 60) {
			return `${Math.floor(seconds)}s`
        }
		if (seconds < 60**2) {
			let normal = seconds/60
            let floor = Math.floor(normal)
			return `${floor}m ${Math.floor((normal-floor)*60)}s`
        }
		if (seconds < 60**2 * 24) {
			let normal = seconds/3600
			let floor = Math.floor(normal)
			return `${floor}h ${Math.floor((normal-floor)*60)}m`
        }
		if (seconds < 60**2 * 24 * 356) {
			let normal = seconds/86400
			let floor = Math.floor(normal)
			return `${floor}d ${Math.floor((normal-floor)*24)}h`
		}
		let normal = seconds/31536000
		return `${normal.toFixed(2)}y`
    }

	if (name) {
        lookupDomain(name, true)
		setInterval(async () => {
			await lookupDomain(name)
		}, 1000)
    }

	function hide(hide) {
		if (hide) {
			document.getElementById("seed").type = "password"
			document.getElementById("address").type = "password"
        }
		else {
			document.getElementById("seed").type = "text"
			document.getElementById("address").type = "text"
		}
    }

	document.getElementById("seed").addEventListener("keyup", async () => {
		let input = document.getElementById("seed").value.trim()
        let pubKey = await get(`global.getPubKey(${JSON.stringify(input)})`)
		let currentKey = (await get('global.domains')).find(item => item[0] === name)[1]
        if (pubKey === currentKey) {
			document.getElementById("changeStatus").innerHTML = `
			    <span style="color: green">Seed matches current registration</span>
			`
        }
		else {
			document.getElementById("changeStatus").innerHTML = `
			    <span style="color: red">Seed does not match current registration</span>
			`
        }
    })
    setInterval(async () => {
		if (name === (await get('global.getData()')).domain) {
			document.getElementById("mineBtn").innerText = "Stop Mining"
            lookupDomain(name)
        }
		else {
			document.getElementById("mineBtn").innerText = "Start Mining"
            lookupDomain(name)
        }
    }, 500)
</script>
</html>
