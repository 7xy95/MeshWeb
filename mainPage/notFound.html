<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Domain Not Found</title>
    <link rel="icon" href="../assets/icon.png">
    <link rel="stylesheet" href="../main.css">
    <style>
        a {
            color: dodgerblue;
        }
    </style>
</head>
<body>
    <p id="info" style="margin: 128px; font-size: 20px"></p>
</body>
<script>
	let params = new URLSearchParams(location.search)
    let name = params.get("name")
    if (name.startsWith("https://")) {name = name.replace("https://", "")}
    document.getElementById("info").innerHTML = `
        <div style="font-size: 32px">404 Not Found</div><br><br>
        The domain '${name}' is not registered.<br><br>
        <div style="font-size: 16px">
            <a href="search.html">Go back to homepage</a><br>
            <a href="domain.html?name=${name}">Register domain</a>
        </div>
    `

	async function isRegistered(name) {
		let domains = await window.mesh.get("global.domains")
		return domains.some(domain => domain[0] === name)
	}
	async function setUrl(url) {
		window.mesh.setUrl(url)
	}

	setInterval(async () => {
		if (await isRegistered(name.split("/")[0])) {
			void setUrl(name)
		}
    }, 500)
</script>
</html>
