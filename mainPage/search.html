<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Tab</title>
    <link rel="icon" href="../assets/icon.png">
    <link rel="stylesheet" href="../main.css">
    <style>
        body {
            font-family: system-ui;
        }
        input::placeholder {
            color: #a5abb1;
        }
        .title {
            font-size: 46px;
            font-weight: 500;
            text-align: center;
            margin-top: 30vh;
        }
        .mainSearch {
            width: 100%;
            height: 35px;
            color: #dfe6ed;
            flex-shrink: 0;
            box-sizing: border-box;
        }
        .mainPage {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        a {
            color: dodgerblue;
            text-decoration: underline;
            cursor: pointer;
        }
        .bottomInfo {
            position: absolute;
            display: flex;
            flex-direction: row;
            bottom: 16px;
            left: 24px;
            font-size: 15px;
            height: 20px;
        }
        .version {
            position: absolute;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
            right: 24px;
            bottom: 16px;
            font-size: 15px;
            height: 20px;
        }
        .version p {
            margin: 0;
        }
        .linkToText {
            color: #dfe6ed;
            text-decoration: none;
        }

        .search {
            width: 45vw;
        }
        #suggestions {
            display: flex;
            flex-direction: column;
        }
        #suggestions button {
            width: 100%;
            border: none;
            background: #2c2c2c none;
            color: inherit;
            font: inherit;
            text-align: left;
            cursor: pointer;

            height: 35px;
        }
    </style>
</head>
<body>

<div class="mainPage">
    <p class="title">Mesh Web</p>
    <div class="search">
        <input class="mainSearch" id="urlInput" placeholder="Search Mesh or type a URL" autofocus>
        <div id="suggestions"></div>
    </div>
    <div class="bottomInfo">
        <a class="linkToText" href="domain.html">Register domain</a>
        <a class="linkToText" href="mining.html" style="margin-left: 32px">Manage mining</a>
        <a class="linkToText" href="howDomainsWork.html" style="margin-left: 32px">How domains work</a>
        <a class="linkToText" onclick="setUrl('docs.mesh')" style="margin-left: 32px">Full documentation</a>
    </div>
    <div class="version">
        <a class="linkToText" href="settings.html">Settings</a>
        <p id="version"></p>
    </div>
</div>
</body>
<script>
    const VERSION = "v1.3.2"
    document.getElementById("version").innerText = VERSION

    async function setUrl(url) {
        window.mesh.setUrl(url)
    }
	async function get(code) {
		return await window.mesh.get(code)
	}
	async function getSettings() {
		return await get('global.settings')
	}

	function simplifyUrl(url) {
		if (url.startsWith("https://") || url.startsWith("http://")) {
			url = url.split("://")[1]
        }
		if (url.startsWith("www.")) {
			url = url.slice(4)
        }
		return url
    }
	function autocomplete(input, suggestion) {
		suggestion = simplifyUrl(suggestion)
		if (!suggestion.startsWith(input)) {return}
		if (suggestion[input.length] === " ") {return}
		urlInput.value = suggestion
        urlInput.setSelectionRange(input.length, suggestion.length)
    }

	function displaySuggestions(suggestions) {
		let s = document.getElementById("suggestions")
        s.innerHTML = ""
        let i = 0
        for (let suggestion of suggestions) {
			if (i >= 6) {break} i++

            let suggestionButton = document.createElement("button")
            s.appendChild(suggestionButton)
			suggestionButton.innerText = simplifyUrl(suggestion)
            suggestionButton.onclick = () => setUrl(suggestion)
        }
    }
	async function addSuggestion(suggestions, input) {
		if (input === "") {return}
		let history = await get('global.searchHistory')
        let matches = Object.keys(history)
            .filter(h => h.startsWith(input))
            .sort((a,b) => history[b] - history[a])
        if (matches.length > 0) {
			if (history[matches[0]] > 3) {
				suggestions.unshift(matches[0])
            }
        }
        return suggestions
    }
	async function getSearchEngine() {
		let searchEngine = (await getSettings()).searchEngine
        searchEngine = searchEngine.replace("https://", "")
		searchEngine = searchEngine.replace("www.", "")
		searchEngine = searchEngine.replace(".com", "")
        let i = searchEngine.indexOf("/")
        searchEngine = searchEngine.slice(0, i)
        if (searchEngine === "google") {return "https://suggestqueries.google.com/complete/search?client=chrome&q="}
		if (searchEngine === "bing") {return "https://api.bing.com/osjson.aspx?query="}
		if (searchEngine === "duckduckgo") {return "https://duckduckgo.com/ac/?q="}
		if (searchEngine === "brave") {return "https://search.brave.com/api/suggest?q="}
		if (searchEngine === "ecosia") {return "https://ac.ecosia.org/autocomplete?q="}
		if (searchEngine === "qwant") {return "https://api.qwant.com/api/suggest/?q="}
		return "https://suggestqueries.google.com/complete/search?client=chrome&q="
    }

    let urlInput = document.getElementById("urlInput")

    urlInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
            setUrl(urlInput.value.trim())
            displaySuggestions([])
        }
    })
    urlInput.addEventListener("input", async (event) => {
		try {
			let input = urlInput.value.trim()
			if (input === "") {
				displaySuggestions([])
				return
			}
			let searchEngine = await getSearchEngine()
			let data = await fetch(`${searchEngine}${encodeURIComponent(input)}`)
			data = await data.json()
			if (urlInput.value !== input) {return}
			let suggestions = data[1]
			suggestions = await addSuggestion(suggestions, input)
			displaySuggestions(suggestions)
			if (!event.inputType.startsWith("delete") && event.data !== " " && suggestions.length > 0) {
				autocomplete(input, suggestions[0])
			}
        }
		catch (error) {
			console.log(error)
        }
    })

    updateVersion()

    async function updateVersion() {
		let response = await fetch("https://api.github.com/repos/7xy95/MeshWeb/releases/latest")
		response = await response.json()
		let version = response.tag_name
		if (version.startsWith("v")) {
			if (version !== VERSION) {
                let v = document.getElementById("version")
                v.style.color = "dodgerblue"
                v.style.textDecoration = "underline"
                v.style.cursor = "click"
                v.innerHTML = `<a href="https://github.com/7xy95/MeshWeb/releases">${version} available!</a>`
			}
		}
    }
</script>
</html>
